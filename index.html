<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inkling">
<meta name="application-name" content="Inkling">
<meta name="theme-color" content="#3a2a1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Inkling</title>
<style>/* reader-app/src/styles/app.css */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body,
#root {
  height: 100%;
}
body {
  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    sans-serif;
  overscroll-behavior: none;
}
.app[data-theme=airy] {
  --bg:#fafafa;
  --bg2:#ffffff;
  --card:#ffffff;
  --ink:#1f2328;
  --muted:#5f6672;
  --accent:#b07b3c;
  --accentText:#8a5a22;
  --hl:#fff3a3;
  --hlA:#fff3a3;
  --hlB:#ffd6e8;
  --hlC:#c9f2d0;
  --line:#e6e8ec;
  --panel:#f1f2f6;
  --shadow:rgba(31,35,40,.1);
  --rule:rgba(176,123,60,.26);
  --pop-anim:snapin .16s ease-out both;
}
.app[data-theme=dark] {
  --bg:#1a1d21;
  --bg2:#24282e;
  --card:#2a2f36;
  --ink:#e8e6e1;
  --muted:#9aa1ab;
  --accent:#e0a458;
  --accentText:#ecb96f;
  --hl:#5c4d2e;
  --hlA:#5c4d2e;
  --hlB:#4a3a52;
  --hlC:#2e4a45;
  --line:#3a4048;
  --panel:#202329;
  --shadow:rgba(0,0,0,.5);
  --rule:rgba(224,164,88,.28);
  --pop-anim:fadein .4s ease both;
}
.app[data-theme=pastel] {
  --bg:#f6f2fa;
  --bg2:#fdfbff;
  --card:#ffffff;
  --ink:#3a3344;
  --muted:#8a7d9c;
  --accent:#b287d8;
  --accentText:#7d54ab;
  --hl:#ffd6e8;
  --hlA:#ffd6e8;
  --hlB:#ddcdf6;
  --hlC:#c9f2d0;
  --line:#e9e0f2;
  --panel:#f0e9f7;
  --shadow:rgba(122,90,160,.15);
  --rule:rgba(178,135,216,.30);
  --pop-anim:bubble .5s cubic-bezier(.34,1.7,.6,1) both;
}
.app[data-theme=forest] {
  --bg:#f4f1ea;
  --bg2:#fbfaf6;
  --card:#fbfaf6;
  --ink:#26302a;
  --muted:#79806f;
  --accent:#3e6b4f;
  --accentText:#31573f;
  --hl:#ffe08a;
  --hlA:#ffe08a;
  --hlB:#f2cbb8;
  --hlC:#cfe3cf;
  --line:#e3dfd2;
  --panel:#ece8dd;
  --shadow:rgba(38,48,42,.12);
  --rule:rgba(62,107,79,.26);
  --pop-anim:leafin .35s ease-in-out both;
}
.app[data-theme=academia] {
  --bg:#171512;
  --bg2:#1f1c17;
  --card:#262119;
  --ink:#e8e0cf;
  --muted:#9a8f79;
  --accent:#2f4a3a;
  --accentText:#c9a227;
  --hl:#6b5a2e;
  --hlA:#6b5a2e;
  --hlB:#5c2b28;
  --hlC:#2c3a52;
  --line:#3a3228;
  --panel:#1c1913;
  --shadow:rgba(0,0,0,.6);
  --rule:rgba(201,162,39,.30);
  --pop-anim:fadein .45s ease both;
}
@keyframes snapin {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fadein {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes bubble {
  0% {
    opacity: 0;
    transform: scale(.2);
  }
  60% {
    transform: scale(1.15);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes leafin {
  from {
    opacity: 0;
    transform: rotate(-6deg) translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes flashhl {
  0%, 100% {
    box-shadow: none;
  }
  40% {
    box-shadow: 0 0 0 3px var(--accent);
  }
}
.ghostpage {
  z-index: 2;
  pointer-events: none;
}
.app[data-page=flat] .ghostpage {
  background: var(--bg);
}
.ghostpage .ghostshade {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity .45s ease;
  pointer-events: none;
}
.ghostpage.g-next .ghostshade {
  background:
    linear-gradient(
      90deg,
      transparent 50%,
      rgba(0, 0, 0, .32));
}
.ghostpage.g-prev .ghostshade {
  background:
    linear-gradient(
      270deg,
      transparent 50%,
      rgba(0, 0, 0, .32));
}
.ghostpage.g-go .ghostshade {
  opacity: 1;
}
.g-slide {
  transition: transform .3s cubic-bezier(.3, .7, .4, 1);
  box-shadow: 0 0 34px rgba(0, 0, 0, .28);
}
.g-slide.g-next.g-go {
  transform: translateX(-105%) !important;
}
.g-slide.g-prev.g-go {
  transform: translateX(105%) !important;
}
.g-sheet {
  transition: transform .56s cubic-bezier(.34, .06, .28, 1), opacity .56s ease;
}
.g-sheet .bookinner {
  box-shadow: 0 3px 6px rgba(0, 0, 0, .32), 0 22px 44px rgba(0, 0, 0, .42) !important;
}
.g-sheet.g-next.g-go {
  transform: translate(-112%, -14px) rotate(-6deg) !important;
  opacity: 0;
}
.g-sheet.g-prev.g-go {
  transform: translate(112%, -14px) rotate(6deg) !important;
  opacity: 0;
}
.g-sheet .ghostshade {
  display: none;
}
.app.nomotion .ghostpage {
  display: none;
}
.underpage {
  z-index: 1;
}
.bpage.folding {
  z-index: 2;
}
.app[data-page=flat] .underpage,
.app[data-page=flat] .bpage.folding {
  background: var(--bg);
}
.foldflap {
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 3;
  pointer-events: none;
  background: var(--card);
}
.foldflap.f-next {
  border-radius: 5px 0 0 5px;
  background:
    linear-gradient(
      90deg,
      rgba(0, 0, 0, .14),
      rgba(255, 255, 255, 0) 14%,
      rgba(255, 255, 255, .20) 82%,
      rgba(255, 255, 255, .65) 96%,
      rgba(140, 125, 100, .35) 100%),
    var(--card);
  box-shadow: -16px 0 26px rgba(0, 0, 0, .22), 20px 0 38px rgba(0, 0, 0, .34);
}
.foldflap.f-prev {
  border-radius: 0 5px 5px 0;
  background:
    linear-gradient(
      270deg,
      rgba(0, 0, 0, .14),
      rgba(255, 255, 255, 0) 14%,
      rgba(255, 255, 255, .20) 82%,
      rgba(255, 255, 255, .65) 96%,
      rgba(140, 125, 100, .35) 100%),
    var(--card);
  box-shadow: 16px 0 26px rgba(0, 0, 0, .22), -20px 0 38px rgba(0, 0, 0, .34);
}
.app.nomotion .foldflap,
.app.nomotion .underpage {
  display: none;
}
.app[data-page=papyrus] .foldflap,
.app[data-page=parchment] .foldflap,
.app[data-page=paper] .foldflap {
  background-color: #ecdfba;
}
.app[data-page=type] .foldflap {
  background-color: #efede4;
}
.app {
  position: fixed;
  inset: 0;
  background: var(--bg);
  color: var(--ink);
  overflow: hidden;
  transition: background .35s, color .35s;
}
.app.nomotion * {
  animation: none !important;
  transition: none !important;
}
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
}
.dimmer {
  position: absolute;
  inset: 0;
  background: #000;
  pointer-events: none;
  z-index: 60;
}
.toast {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--ink);
  color: var(--bg);
  padding: 9px 18px;
  border-radius: 18px;
  font-size: 12.5px;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  z-index: 70;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: .95;
  transform: translateX(-50%);
}
.navbtn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 16px;
  padding: 9px 15px;
  font-size: 12.5px;
  cursor: pointer;
  min-height: 40px;
}
.gearbtn {
  background: none;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--muted);
  min-width: 44px;
  min-height: 44px;
}
.libhead {
  padding: 20px 26px 6px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.libhead h1 {
  font-family: Georgia, serif;
  font-size: 28px;
  margin-right: auto;
}
.libhead span {
  color: var(--muted);
  font-size: 13px;
}
.importbtn {
  border: 1.5px dashed var(--accent);
  color: var(--accentText);
  background: none;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  min-height: 44px;
}
.libtools {
  display: flex;
  gap: 10px;
  padding: 2px 26px 0;
  align-items: center;
  flex-wrap: wrap;
}
.shelves {
  display: flex;
  gap: 8px;
}
.shelf {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 16px;
  padding: 9px 15px;
  font-size: 12.5px;
  cursor: pointer;
  min-height: 38px;
}
.shelf.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.libsearch {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.libsearch input {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 16px;
  padding: 9px 14px;
  font-size: 12.5px;
  width: 160px;
}
.sortbtn {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--muted);
  border-radius: 16px;
  padding: 8px 12px;
  font-size: 12px;
  cursor: pointer;
}
.sortbtn.active {
  color: var(--accentText);
  border-color: var(--accent);
  font-weight: 600;
}
.library {
  position: relative;
}
.library::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(
      ellipse 70% 46% at 18% -6%,
      color-mix(in srgb, var(--accent) 26%, transparent),
      transparent 68%),
    radial-gradient(
      ellipse 90% 60% at 92% 104%,
      rgba(0, 0, 0, .16),
      transparent 66%);
}
.library > * {
  position: relative;
  z-index: 1;
}
.libhead .greet {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}
.libhead .greet b {
  color: var(--ink);
  font-weight: 600;
}
.continue {
  margin: 14px 26px 4px;
  background:
    linear-gradient(
      140deg,
      var(--card),
      color-mix(in srgb, var(--card) 82%, var(--accent)));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  cursor: pointer;
  box-shadow: 0 12px 30px var(--shadow);
  transition: transform .18s ease, box-shadow .18s ease;
}
.continue:active {
  transform: scale(.988);
}
.continue .cbar {
  width: 78px;
  height: 104px;
  border-radius: 4px 9px 9px 4px;
  flex: none;
  position: relative;
  overflow: hidden;
  box-shadow: 0 8px 18px rgba(0, 0, 0, .32);
}
.continue .cbar::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 0;
  bottom: 0;
  width: 3px;
  background: rgba(0, 0, 0, .24);
}
.continue .cbar::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      105deg,
      rgba(255, 255, 255, .18),
      transparent 40%);
}
.continue .ctext {
  min-width: 0;
}
.continue .ckicker {
  font-size: 10.5px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--accentText);
  margin-bottom: 5px;
}
.continue b {
  font-family: Georgia, serif;
  font-size: 20px;
  line-height: 1.25;
  display: block;
  margin-bottom: 5px;
}
.continue small {
  color: var(--muted);
  font-size: 12.5px;
  display: block;
}
.continue .cprog {
  margin-top: 9px;
  height: 4px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
  max-width: 280px;
}
.continue .cprog i {
  display: block;
  height: 100%;
  background: var(--accent);
}
.continue .carrow {
  margin-left: auto;
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: var(--accentText);
  font-size: 17px;
}
.grid {
  --rowh:268px;
  --plank:15px;
  --recess:16px;
  --rowgap:calc(var(--plank) + var(--recess));
  --padtop:22px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
  grid-auto-rows: var(--rowh);
  align-items: stretch;
  gap: var(--rowgap) 22px;
  padding: var(--padtop) 26px 60px;
  overflow-y: auto;
  background-repeat: repeat-y;
  background-attachment: local;
  background-position: 0 var(--padtop);
  background-size: 100% calc(var(--rowh) + var(--rowgap));
  background-image:
    linear-gradient(
      to bottom,
      transparent 0 calc(var(--rowh) - 26px),
      rgba(0, 0, 0, .16) calc(var(--rowh) - 26px) calc(var(--rowh) - 2px),
      rgba(0, 0, 0, .42) calc(var(--rowh) - 2px) var(--rowh),
      var(--plank-a, #a9814f) var(--rowh) calc(var(--rowh) + 4px),
      var(--plank-b, #7d5a32) calc(var(--rowh) + 4px) calc(var(--rowh) + 11px),
      var(--plank-c, #4e3620) calc(var(--rowh) + 11px) calc(var(--rowh) + var(--plank)),
      rgba(0, 0, 0, .22) calc(var(--rowh) + var(--plank)) calc(var(--rowh) + var(--plank) + 7px),
      transparent calc(var(--rowh) + var(--plank) + 7px) 100%);
}
.app[data-theme=dark] .grid,
.app[data-theme=academia] .grid {
  --plank-a:#6b5334;
  --plank-b:#4a3722;
  --plank-c:#2a1e12;
}
.covwrap {
  position: relative;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  animation: shelfin .5s cubic-bezier(.25, .9, .3, 1) both;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.app.nomotion .covwrap {
  animation: none;
}
@keyframes shelfin {
  from {
    opacity: 0;
    transform: translateY(16px) scale(.97);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.covwrap.filler {
  pointer-events: none;
  animation: none;
}
.cover {
  box-shadow:
    0 10px 22px rgba(0, 0, 0, .34),
    inset -3px 0 0 rgba(255, 255, 255, .16),
    inset -5px 0 0 rgba(0, 0, 0, .10);
}
.cover {
  aspect-ratio: 3/4.1;
  border-radius: 10px;
  padding: 15px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  box-shadow: 0 8px 18px var(--shadow);
  transition: transform .15s;
  position: relative;
  overflow: hidden;
}
.cover::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 0;
  bottom: 0;
  width: 3px;
  background: rgba(0, 0, 0, .20);
  pointer-events: none;
}
.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      105deg,
      rgba(255, 255, 255, .14),
      transparent 32%),
    repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, .02) 0 2px,
      transparent 2px 5px);
  pointer-events: none;
}
.cover:active {
  transform: scale(.97);
}
.cover h3 {
  font-family: Georgia, serif;
  font-size: 16.5px;
  line-height: 1.25;
}
.cover small {
  opacity: .85;
  font-size: 11px;
}
.cover .mono {
  font-family: Georgia, serif;
  font-size: 32px;
  opacity: .5;
  letter-spacing: 2px;
}
.prog {
  height: 4px;
  background: rgba(255, 255, 255, .25);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.prog i {
  display: block;
  height: 100%;
  background: #fff;
}
.genre {
  font-size: 10px;
  background: rgba(255, 255, 255, .22);
  border-radius: 10px;
  padding: 2px 8px;
  align-self: flex-start;
  margin-bottom: 6px;
}
.rtop {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg2);
  position: relative;
  z-index: 5;
  transition: margin-top .3s ease;
}
.reader.immersive .rtop {
  margin-top: -66px;
}
.reader.immersive .pagechip {
  opacity: 0;
}
.rtop .back {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
  min-width: 44px;
  min-height: 44px;
}
.rtop .title {
  font-family: Georgia, serif;
  font-size: 15px;
}
.rtop .chap {
  color: var(--muted);
  font-size: 12px;
}
.rtop .spacer {
  flex: 1;
}
.iconbtn {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 19px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.modebtn {
  border: 1.5px solid var(--accent);
  color: var(--accentText);
  background: none;
  border-radius: 20px;
  padding: 10px 14px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 600;
  min-height: 44px;
  white-space: nowrap;
}
.modebtn.on {
  background: var(--accent);
  color: #fff;
}
.rpop {
  position: absolute;
  top: 60px;
  right: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 10px 24px var(--shadow);
  padding: 8px;
  z-index: 25;
  min-width: 230px;
}
.rpop .item {
  padding: 11px 12px;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  animation: var(--pop-anim);
  animation-delay: calc(var(--i)*45ms);
}
.rpop .item.cur {
  color: var(--accentText);
  font-weight: 600;
}
.rpop input {
  width: 100%;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  margin-bottom: 6px;
}
.rpop .hint {
  font-size: 11px;
  color: var(--muted);
  padding: 0 2px;
}
.rbody {
  flex: 1;
  display: flex;
  min-height: 0;
}
.bookpane {
  flex: 1;
  position: relative;
  overflow: hidden;
  touch-action: pan-y;
}
.app[data-layout=spread] .bookpane {
  touch-action: none;
}
.reader.notemode .bookpane {
  touch-action: auto;
}
.bpage {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  padding: 30px 0;
  z-index: 1;
  font-family: Georgia, serif;
  font-size: var(--bookfs,17px);
  line-height: var(--booklh,1.75);
}
.bookinner {
  max-width: min(640px, 33em);
  margin: 0 auto;
  padding: 0 36px;
  position: relative;
  text-align: justify;
  text-justify: inter-word;
  hyphens: auto;
  -webkit-hyphens: auto;
  text-wrap: pretty;
}
.reader.notemode .bookinner {
  max-width: none;
  text-align: left;
  hyphens: none;
}
.reader.hlmode .bookpane {
  cursor: cell;
}

.coverintro {
  position: absolute;
  inset: 0;
  z-index: 30;
  cursor: pointer;
  perspective: 2600px;
  transition: opacity .35s ease .62s;
}
.coverintro .coverflip {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(340px, 62vw);
  aspect-ratio: 3/4.1;
  margin: -29vh 0 0 -20vw;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform .92s cubic-bezier(.42, .05, .28, 1);
  opacity: 0;
}
.coverintro.placed .coverflip {
  opacity: 1;
  margin: 0;
  aspect-ratio: auto;
  transition: transform .92s cubic-bezier(.42, .05, .28, 1), opacity .25s ease;
}
.coverface {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 5px 13px 13px 5px;
  overflow: hidden;
}
.coverface.front {
  padding: 26px;
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 22px 55px rgba(0, 0, 0, .42);
}
.coverface.front::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 0;
  bottom: 0;
  width: 4px;
  background: rgba(0, 0, 0, .20);
}
.coverface.front::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(
      105deg,
      rgba(255, 255, 255, .16),
      transparent 34%);
  pointer-events: none;
}
.coverface.front h2 {
  font-family: Georgia, serif;
  font-size: 26px;
  line-height: 1.25;
}
.coverface.front .mono {
  font-family: Georgia, serif;
  font-size: 52px;
  opacity: .5;
  letter-spacing: 3px;
}
.coverface.front small {
  opacity: .85;
  font-size: 13px;
}
.coverface.back {
  transform: rotateY(180deg);
  background: #efe7d4;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
}
.coverface.back .endpaper {
  position: absolute;
  inset: 11px;
  border-radius: 4px;
  background:
    radial-gradient(
      circle at 22% 28%,
      hsl(var(--chue,205) 32% 82% / .55),
      transparent 46%),
    radial-gradient(
      circle at 74% 64%,
      hsl(var(--chue,205) 26% 76% / .4),
      transparent 52%),
    radial-gradient(
      circle at 55% 12%,
      rgba(255, 255, 255, .5),
      transparent 40%),
    repeating-linear-gradient(
      115deg,
      rgba(0, 0, 0, .02) 0 3px,
      transparent 3px 9px),
    #f4eedf;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .06), inset 14px 0 22px -16px rgba(0, 0, 0, .3);
}
.coverintro .tapline {
  position: absolute;
  bottom: 7%;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: rgba(20, 16, 12, .45);
  padding: 6px 15px;
  border-radius: 16px;
  font-size: 13px;
  backdrop-filter: blur(2px);
}
.coverintro.opening {
  opacity: 0;
}
.coverintro.opening .coverflip {
  transform: rotateY(-178deg);
}
.coverintro.opening .tapline {
  opacity: 0;
  transition: opacity .25s;
}
.app.nomotion .coverintro,
.app.nomotion .coverintro .coverflip {
  transition: none;
}
.reader.cwait .bpage,
.reader.cwait .bookpane .spine {
  opacity: 0;
}
.reader.cwait .rtop,
.reader.copen .rtop,
.reader.cshut .rtop {
  z-index: 31;
}
.reader.copen .bookpane .spine,
.reader.copen .bpage {
  opacity: 1;
  transition: opacity .34s ease .55s;
}
.reader.cshut .bookpane .spine,
.reader.cshut .bpage {
  opacity: 0;
  transition: opacity .3s ease .34s;
}
.app.nomotion .reader.copen .bpage,
.app.nomotion .reader.cshut .bpage {
  transition: none;
}
@keyframes shutcover {
  from {
    transform: rotateY(-178deg);
  }
  to {
    transform: rotateY(0deg);
  }
}
@keyframes shutline {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.coverintro.shutting .coverflip {
  animation: shutcover .9s cubic-bezier(.42, .05, .28, 1) both;
}
.coverintro.shutting .tapline {
  animation: shutline .3s ease .68s both;
}
.app.nomotion .coverintro.shutting .coverflip,
.app.nomotion .coverintro.shutting .tapline {
  animation: none;
}

@keyframes flick {
  0%, 100% {
    opacity: .85;
  }
  30% {
    opacity: 1;
  }
  55% {
    opacity: .7;
  }
  80% {
    opacity: .95;
  }
}
@keyframes flamewob {
  0%, 100% {
    transform: scale(1) skewX(0);
  }
  30% {
    transform: scale(1.06, 1.12) skewX(3deg);
  }
  60% {
    transform: scale(.95, .92) skewX(-3deg);
  }
}
@keyframes dripgrow {
  0%, 70% {
    height: 16px;
  }
  92%, 100% {
    height: 28px;
  }
}
@keyframes moteup {
  0% {
    transform: translateY(0);
    opacity: 0;
  }
  15% {
    opacity: .6;
  }
  85% {
    opacity: .4;
  }
  100% {
    transform: translateY(-130px) translateX(14px);
    opacity: 0;
  }
}
@keyframes swaysh {
  0% {
    transform: rotate(-2deg) translateX(0);
  }
  100% {
    transform: rotate(2deg) translateX(10px);
  }
}
@keyframes leaffall {
  0% {
    top: -6%;
    transform: rotate(0) translateX(0);
    opacity: 0;
  }
  4% {
    opacity: .55;
  }
  26% {
    top: 104%;
    transform: rotate(300deg) translateX(40px);
    opacity: .45;
  }
  27%, 100% {
    opacity: 0;
    top: -6%;
  }
}
@keyframes blobdrift {
  0%, 100% {
    transform: translate(0, 0) scale(1);
  }
  50% {
    transform: translate(26px, -18px) scale(1.06);
  }
}
@keyframes catbreathe {
  0%, 100% {
    transform: scaleY(1);
  }
  50% {
    transform: scaleY(1.045);
  }
}
@keyframes steamup {
  0% {
    transform: translateY(0) skewX(0);
    opacity: 0;
  }
  25% {
    opacity: .5;
  }
  100% {
    transform: translateY(-26px) skewX(8deg);
    opacity: 0;
  }
}
@keyframes lanternsway {
  0%, 100% {
    transform: rotate(-2.5deg);
  }
  50% {
    transform: rotate(2.5deg);
  }
}
@keyframes caretblink {
  0%, 49% {
    opacity: 1;
  }
  50%, 100% {
    opacity: 0;
  }

var dashboard_handbook_default = "# Dashboard Handbook\n\n## Why a dashboard at all\n\nEvery project starts with a question, and the dashboard started with this one: where does all the information live, and why do I need six browser tabs to see it?\n\nThe answer became a single PHP application with one job: show the day at a glance. This handbook is the story of how it was built, written so that future-me (and anyone else) can understand every decision.\n\n## Login & sessions\n\nA session is just a promise the server makes to itself: this browser, for the next while, belongs to that person.\n\nThe login flow has three steps. The form posts a username and password. The server checks the hash, never the password itself. On success, it writes one session value and redirects.\n\nSessions expire after thirty minutes of silence. That number lives in one config file, not scattered through the code.\n\n## Screens & routing\n\nEvery screen is a file, and the router is a switch statement short enough to read in one breath. Fancy routing libraries solve problems this dashboard does not have.\n\nEach screen file does three things in order: check the session, fetch its data, include the template. A screen that does anything else is doing too much.\n\n## Talking to the database\n\nEvery screen in the dashboard starts with the same question: what data do I need, and who is allowed to see it? Before writing a single query, the handbook rule is to write that sentence down in plain words.\n\nThe connection lives in one file. Nothing else in the project opens its own connection \u2014 every page borrows the same one. This is the single most important habit from the whole build: **one door to the database**, so there is one place to lock.\n\nQueries never trust user input. Anything that arrives from a form goes through a prepared statement, even when it feels harmless. The day you skip this is the day someone types something clever into a search box.\n\nResults come back as plain arrays and get shaped *before* they reach the page. The page's only job is to display; if the page is doing math, the query was lazy.\n\n## Errors & logging\n\nErrors are boring on purpose. Every query failure lands in the same log file with the same shape: timestamp, query name, message. Boring logs are readable logs, and readable logs are the ones that get read.\n\nThe chapter checklist: one connection file, prepared statements everywhere, shape data before display, log failures the boring way. Four habits, no exceptions.\n";

var how_inkling_works_default = '# How Inkling Works\n\n## The book about the book app\n\nYou are reading a book, inside an app, about how the app you are reading it in was built. If that sentence made you smile, this book is working already.\n\nThis is the story of the build \u2014 every moving part, explained the way you learn best: a picture first, then the idea, then what it means for you. Nothing here requires you to have built anything bigger than your dashboard, Korva, and the egg timer. In fact, we will lean on those constantly, because you already know more than you think.\n\nHere is the whole app on one page:\n\n<svg viewBox="0 0 560 300" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="300" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="30" y="40" width="150" height="90" rx="10" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="105" y="75" text-anchor="middle" font-family="Georgia" font-size="15" fill="#33291c">Library</text>\n<text x="105" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">covers \xB7 shelves \xB7 search</text>\n<rect x="230" y="40" width="150" height="90" rx="10" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="305" y="75" text-anchor="middle" font-family="Georgia" font-size="15" fill="#33291c">Reader</text>\n<text x="305" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">chapters \xB7 scenes \xB7 pen</text>\n<rect x="430" y="40" width="100" height="90" rx="10" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="480" y="75" text-anchor="middle" font-family="Georgia" font-size="14" fill="#33291c">Notes</text>\n<text x="480" y="96" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">as a book</text>\n<line x1="180" y1="85" x2="222" y2="85" stroke="#8a7f70" stroke-width="2" marker-end="url(#ar)"/>\n<line x1="380" y1="85" x2="422" y2="85" stroke="#8a7f70" stroke-width="2" marker-end="url(#ar)"/>\n<rect x="140" y="190" width="280" height="70" rx="10" fill="#fff" stroke="#8a7f70" stroke-width="1.5" stroke-dasharray="5 4"/>\n<text x="280" y="219" text-anchor="middle" font-family="Georgia" font-size="14" fill="#33291c">The stores</text>\n<text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">settings \xB7 positions \xB7 notes \xB7 highlights</text>\n<line x1="105" y1="130" x2="240" y2="188" stroke="#c9bfa8" stroke-width="1.5"/>\n<line x1="305" y1="130" x2="290" y2="188" stroke="#c9bfa8" stroke-width="1.5"/>\n<line x1="480" y1="130" x2="350" y2="188" stroke="#c9bfa8" stroke-width="1.5"/>\n<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThree screens on top, one memory underneath. Every arrow in this book is something you will understand by the last chapter. The three screens are just furniture \u2014 the interesting part is that dashed box at the bottom, because *that* is what makes this a real app instead of a pretty mockup: things are remembered.\n\n- The **Library** knows which books exist and how far you got in each.\n- The **Reader** turns markdown files into chapters, paints the scenes, and hosts the pen.\n- The **Notes** screen re-collects everything you wrote, as a book of its own.\n- The **stores** underneath remember all of it, even when the app closes.\n\nOne warning before we start: this book will occasionally show you real code from the project. It will always be small, and the explanation always comes right after \u2014 code first, meaning second, exactly how you like it.\n\n## Two worlds: your PHP brain and this app\n\nYou built the dashboard in PHP, so your instincts say: the browser asks, the server thinks, the browser shows the answer. That is a *round trip* \u2014 and it is the single biggest thing to unlearn here, because this app makes no trips at all.\n\n<svg viewBox="0 0 560 250" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="250" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<text x="20" y="34" font-family="Georgia" font-size="14" fill="#33291c">Your dashboard (PHP)</text>\n<rect x="20" y="48" width="110" height="44" rx="8" fill="#fff" stroke="#8a7f70"/>\n<text x="75" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">browser</text>\n<rect x="225" y="48" width="110" height="44" rx="8" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="280" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">PHP server</text>\n<rect x="430" y="48" width="110" height="44" rx="8" fill="#fff" stroke="#8a7f70"/>\n<text x="485" y="74" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">MySQL</text>\n<line x1="130" y1="62" x2="218" y2="62" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a2)"/>\n<line x1="218" y1="80" x2="130" y2="80" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a2)"/>\n<line x1="335" y1="62" x2="423" y2="62" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a2)"/>\n<line x1="423" y1="80" x2="335" y2="80" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a2)"/>\n<text x="174" y="54" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">ask</text>\n<text x="174" y="94" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">answer</text>\n<text x="20" y="150" font-family="Georgia" font-size="14" fill="#33291c">Inkling (React)</text>\n<rect x="20" y="164" width="320" height="60" rx="8" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="180" y="189" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">the whole app lives in the browser</text>\n<text x="180" y="208" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">thinking, drawing, remembering \u2014 all local</text>\n<rect x="400" y="164" width="140" height="60" rx="8" fill="#fff" stroke="#8a7f70" stroke-dasharray="5 4"/>\n<text x="470" y="189" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">device storage</text>\n<text x="470" y="207" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">no server, no trips</text>\n<line x1="340" y1="194" x2="393" y2="194" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a2)"/>\n<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nIn the dashboard, pressing a button means a letter gets mailed to the server and you wait for the reply. In Inkling, pressing a button means a function runs *right there*, in the same room. There is no server because there is nothing to ask a server for: your books are packed inside the app, your notes are saved on the device itself.\n\nThis is why the app works on a plane, in a tunnel, and in a power cut (briefly). It is also why there is no login screen \u2014 the tablet is the account.\n\n- PHP dashboard: logic on the server, data in MySQL, browser just displays.\n- Inkling: logic in the browser, data on the device, nothing else exists.\n- Both are correct designs \u2014 for their jobs. A shared dashboard needs a server. A private reader does not.\n\n## The toolchain: Node, Vite, and Capacitor\n\nThree tools stand between the code and your tablet, and each has exactly one job. People make these sound mystical; they are a kettle, a funnel, and a suitcase.\n\n<svg viewBox="0 0 560 210" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="210" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="22" y="30" width="120" height="54" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="82" y="53" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">your code</text>\n<text x="82" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">.jsx \xB7 .css \xB7 .md</text>\n<rect x="220" y="30" width="120" height="54" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="280" y="53" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">Vite</text>\n<text x="280" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">bundles it for browsers</text>\n<rect x="418" y="30" width="120" height="54" rx="9" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="478" y="53" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">Capacitor</text>\n<text x="478" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">wraps it as Android</text>\n<line x1="142" y1="57" x2="213" y2="57" stroke="#8a7f70" stroke-width="2" marker-end="url(#a3)"/>\n<line x1="340" y1="57" x2="411" y2="57" stroke="#8a7f70" stroke-width="2" marker-end="url(#a3)"/>\n<rect x="220" y="130" width="120" height="50" rx="9" fill="#fff" stroke="#8a7f70" stroke-dasharray="5 4"/>\n<text x="280" y="151" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">npm run dev</text>\n<text x="280" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">instant preview loop</text>\n<line x1="280" y1="84" x2="280" y2="123" stroke="#c9bfa8" stroke-width="1.5"/>\n<rect x="418" y="130" width="120" height="50" rx="9" fill="#fff" stroke="#8a7f70" stroke-dasharray="5 4"/>\n<text x="478" y="151" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">Android Studio</text>\n<text x="478" y="168" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">presses it onto the tablet</text>\n<line x1="478" y1="84" x2="478" y2="123" stroke="#c9bfa8" stroke-width="1.5"/>\n<defs><marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\n**Node** is the kettle \u2014 it is not part of the app at all, it just powers the tools. It lets JavaScript run on your computer instead of only inside a browser, the same way XAMPP let PHP run on your machine.\n\n**Vite** is the funnel. Your project is dozens of files that browsers cannot use directly (`.jsx` is not a real browser language). Vite pours them all in the top and out the bottom comes a tight bundle of plain JavaScript and CSS that any browser understands. It has two moods: `npm run dev` (keeps the funnel open and re-pours instantly every time you save a file \u2014 this is your daily driver) and `npm run build` (one final, optimized pour into the `dist` folder).\n\n**Capacitor** is the suitcase. It takes the `dist` folder and packs it inside a real Android app: an app that is, honestly, a full-screen browser window with your bundle inside \u2014 plus a bridge to native things browsers cannot touch, like the tablet\'s preference storage, and later the TTS voice and the ML Kit handwriting engine.\n\n- `npm run dev` \u2192 develop in the browser, instant feedback.\n- `npm run build` \u2192 produce `dist`, the finished website.\n- `npx cap sync android` \u2192 copy `dist` into the Android suitcase.\n- Android Studio \u2192 press Run, and it is on your tablet.\n## A map of the project\n\nOpen the `reader-app` folder and you see this. Every box has one responsibility \u2014 if a file ever seems to be doing two jobs, that is a smell (remember the handbook rule: a screen that does more than fetch-check-show is doing too much; same law here).\n\n<svg viewBox="0 0 560 330" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="330" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="20" y="22" width="150" height="34" rx="7" fill="#fff" stroke="#8a7f70"/>\n<text x="95" y="44" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">index.html + main.jsx</text>\n<text x="200" y="44" font-family="sans-serif" font-size="10" fill="#8a7f70">the front door \u2014 loads App</text>\n<rect x="20" y="70" width="150" height="34" rx="7" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="95" y="92" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">src/screens/</text>\n<text x="200" y="92" font-family="sans-serif" font-size="10" fill="#8a7f70">Library \xB7 Reader \xB7 NotesLibrary</text>\n<rect x="20" y="118" width="150" height="34" rx="7" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="95" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">src/components/</text>\n<text x="200" y="140" font-family="sans-serif" font-size="10" fill="#8a7f70">NotePanel \xB7 SettingsPanel \xB7 Scene \xB7 Icons</text>\n<rect x="20" y="166" width="150" height="34" rx="7" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="95" y="188" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">src/lib/</text>\n<text x="200" y="188" font-family="sans-serif" font-size="10" fill="#8a7f70">the brains: books \xB7 store \xB7 highlights \xB7 audio</text>\n<rect x="20" y="214" width="150" height="34" rx="7" fill="#fff" stroke="#8a7f70"/>\n<text x="95" y="236" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">src/books/</text>\n<text x="200" y="236" font-family="sans-serif" font-size="10" fill="#8a7f70">the .md books + one-line registry</text>\n<rect x="20" y="262" width="150" height="34" rx="7" fill="#fff" stroke="#8a7f70"/>\n<text x="95" y="284" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">src/styles/</text>\n<text x="200" y="284" font-family="sans-serif" font-size="10" fill="#8a7f70">app.css (design system) \xB7 scenes.css (ambience)</text>\n</svg>\n\nThe rule of reading this project: **screens** arrange things, **components** are reusable furniture, and **lib** does the thinking. Screens and components are allowed to be pretty and dumb. Lib files are plain JavaScript with no visuals at all \u2014 which means you can test them, reuse them, and reason about them without a browser.\n\nNotice what is *not* here: no `database/`, no `api/`, no `vendor/`. The whole app is the front-end, because chapter two already told you why.\n\n## React in one honest chapter\n\nReact scares people because tutorials start with jargon. Here is the entire idea in one picture:\n\n<svg viewBox="0 0 560 240" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="240" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="60" y="30" width="140" height="52" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="130" y="53" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">state</text>\n<text x="130" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">ch = 3, noteMode = true</text>\n<rect x="360" y="30" width="140" height="52" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="430" y="53" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">screen</text>\n<text x="430" y="71" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">what you see</text>\n<rect x="360" y="150" width="140" height="52" rx="9" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="430" y="173" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">event</text>\n<text x="430" y="191" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">you tap the edge</text>\n<rect x="60" y="150" width="140" height="52" rx="9" fill="#fff" stroke="#8a7f70" stroke-width="2"/>\n<text x="130" y="173" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">setState</text>\n<text x="130" y="191" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">setCh(4)</text>\n<path d="M205 56 L353 56" stroke="#8a7f70" stroke-width="2" marker-end="url(#a4)"/>\n<path d="M430 87 L430 143" stroke="#8a7f70" stroke-width="2" marker-end="url(#a4)"/>\n<path d="M355 176 L207 176" stroke="#8a7f70" stroke-width="2" marker-end="url(#a4)"/>\n<path d="M130 145 L130 89" stroke="#8a7f70" stroke-width="2" marker-end="url(#a4)"/>\n<text x="280" y="47" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">render</text>\n<text x="280" y="196" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">handler runs</text>\n<defs><marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nA React component is a function that answers one question: *given the current facts, what should the screen look like?* The facts are called **state**. You never edit the screen directly \u2014 no `document.getElementById`, no manually adding rows like in the dashboard\'s JavaScript. You change a fact, and React repaints whatever that fact touched.\n\nReal code from the Reader, the chapter-turning part:\n\n```\nconst [ch, setCh] = useState(0);\n\nfunction go(delta) {\n  setCh(c => Math.max(0, Math.min(book.chapters.length - 1, c + delta)));\n}\n```\n\nRead it like this: "there is a fact called `ch`, starting at 0, and the only way to change it is `setCh`." When an edge-tap calls `go(1)`, the fact becomes 1, and React re-renders: the chapter text, the progress bar, the chip that shows note counts \u2014 everything that mentions `ch` updates by itself. You wrote *what depends on what*, and React does the bookkeeping.\n\nThe loop in the picture never stops while the app is open. Every feature in Inkling \u2014 theme switching, note mode sliding in, the candle burning down \u2014 is that same square dance: event, setState, render.\n\n- **Props** are just arguments passed into a component, like function parameters.\n- **State** is memory that survives between renders of one component.\n- **Effects** (`useEffect`) are "do this after rendering" hooks \u2014 Inkling uses them to load saved data and to re-apply highlights after a chapter renders.\n\n## How a markdown file becomes a book\n\nYour books are plain `.md` files \u2014 the same format you write in anyway. The transformation happens in `src/lib/books.js` and it is delightfully unmagical:\n\n<svg viewBox="0 0 560 220" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="220" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="24" y="30" width="130" height="160" rx="8" fill="#fff" stroke="#8a7f70"/>\n<text x="89" y="52" text-anchor="middle" font-family="monospace" font-size="10" fill="#33291c"># Title</text>\n<text x="89" y="76" text-anchor="middle" font-family="monospace" font-size="10" fill="#c05b3c">## Chapter 1</text>\n<text x="89" y="94" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a7f70">text text text</text>\n<text x="89" y="120" text-anchor="middle" font-family="monospace" font-size="10" fill="#c05b3c">## Chapter 2</text>\n<text x="89" y="138" text-anchor="middle" font-family="monospace" font-size="9" fill="#8a7f70">text text</text>\n<text x="89" y="164" text-anchor="middle" font-family="monospace" font-size="10" fill="#c05b3c">## Chapter 3</text>\n<rect x="215" y="70" width="120" height="60" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="275" y="95" text-anchor="middle" font-family="Georgia" font-size="12" fill="#33291c">split on ##</text>\n<text x="275" y="113" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">then marked() each part</text>\n<line x1="154" y1="100" x2="208" y2="100" stroke="#8a7f70" stroke-width="2" marker-end="url(#a5)"/>\n<rect x="396" y="34" width="140" height="40" rx="8" fill="#fff" stroke="#c05b3c"/>\n<text x="466" y="58" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">chapter 1 \xB7 HTML</text>\n<rect x="396" y="88" width="140" height="40" rx="8" fill="#fff" stroke="#c05b3c"/>\n<text x="466" y="112" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">chapter 2 \xB7 HTML</text>\n<rect x="396" y="142" width="140" height="40" rx="8" fill="#fff" stroke="#c05b3c"/>\n<text x="466" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#33291c">chapter 3 \xB7 HTML</text>\n<line x1="335" y1="100" x2="389" y2="100" stroke="#8a7f70" stroke-width="2" marker-end="url(#a5)"/>\n<defs><marker id="a5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThe parser walks the file line by line. A line starting `# ` becomes the book title. Every line starting `## ` closes the previous chapter and opens a new one. Everything else is chapter body. Each body then goes through **marked**, a small library that turns markdown into HTML \u2014 `**bold**` becomes `<b>bold</b>`, lists become lists.\n\nAdding a book to the app is therefore two steps, and this very book arrived that way:\n\n```\nimport buildbook from \'./how-inkling-works.md?raw\';\n\n{ id: \'buildbook\', title: \'How Inkling Works\',\n  shelf: \'claude\', genre: \'From Claude\', hue: 265, source: buildbook }\n```\n\nThe strange `?raw` suffix tells Vite: do not interpret this file, hand me its text. The `hue: 265` is the one number the cover generator needs \u2014 chapter nine of the mockup era taught us covers can be grown from a single hue plus the title\'s initials. Drop a file, add a line, rebuild: new book on the shelf, cover and all.\n## The stores: how the app remembers\n\nClose the dashboard\'s browser tab and nothing is lost, because MySQL holds everything. Inkling has no MySQL \u2014 so where do your notes live when the app closes? In the **stores**, the dashed box from chapter one. This is the part of the build I am proudest of, because the mockup got it wrong on purpose so we could see the difference.\n\n<svg viewBox="0 0 560 260" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="260" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="30" y="26" width="500" height="44" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="280" y="53" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">screens ask questions \xB7 never touch storage directly</text>\n<rect x="30" y="102" width="500" height="44" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="280" y="122" text-anchor="middle" font-family="Georgia" font-size="12" fill="#33291c">store.js</text>\n<text x="280" y="138" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">loadNotes \xB7 addHighlight \xB7 savePosition \xB7 exportNotesMd</text>\n<rect x="30" y="178" width="230" height="52" rx="9" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="145" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">Capacitor Preferences</text>\n<text x="145" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">on the tablet</text>\n<rect x="300" y="178" width="230" height="52" rx="9" fill="#fff" stroke="#8a7f70" stroke-dasharray="5 4"/>\n<text x="415" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">localStorage</text>\n<text x="415" y="218" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">in the browser while developing</text>\n<line x1="280" y1="70" x2="280" y2="96" stroke="#8a7f70" stroke-width="2" marker-end="url(#a6)"/>\n<line x1="200" y1="146" x2="160" y2="172" stroke="#8a7f70" stroke-width="2" marker-end="url(#a6)"/>\n<line x1="360" y1="146" x2="400" y2="172" stroke="#8a7f70" stroke-width="2" marker-end="url(#a6)"/>\n<text x="60" y="166" font-family="sans-serif" font-size="9" fill="#8a7f70">storage.js picks one</text>\n<defs><marker id="a6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThe layering matters more than the files. A screen never says "write this to disk" \u2014 it says `addNote(note)` and walks away. The store decides what a note *is*. Underneath, `storage.js` decides *where* it sleeps: on the tablet it uses Capacitor\'s Preferences (real device storage, survives everything), and in the browser during development it quietly falls back to localStorage. The screens genuinely cannot tell the difference \u2014 which is why the same code runs in both places unchanged.\n\nHere is an actual note, as it is stored:\n\n```\n{ id: "n1754923412", bookId: "handbook", chapter: 3,\n  type: "text", content: "onthouden: one door!",\n  lang: "NL", ts: 1754923412000 }\n```\n\nThat is the whole secret: a note is a small honest object. The card in the note panel, the entry in the notes library, the line in the markdown export \u2014 all three are just different *outfits* for this same object. The mockup did it backwards (the card WAS the note, so switching books destroyed your notes); the review caught it, and the real app was born data-first.\n\n- Settings, positions, notes, highlights: four keys, four little JSON collections.\n- Export walks the collections, never the screen \u2014 so it can run even from a book you are not looking at.\n- Want a sync feature someday? You would only touch `storage.js`. Nothing above it would notice.\n\n## The reader, tap by tap\n\nThe reader looks calm, but it is interpreting everything your fingers do. One picture explains all of its manners:\n\n<svg viewBox="0 0 560 230" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="230" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="40" y="30" width="480" height="150" rx="10" fill="#fff" stroke="#8a7f70" stroke-width="1.5"/>\n<rect x="40" y="30" width="72" height="150" rx="10" fill="#f0e4cf"/>\n<rect x="448" y="30" width="72" height="150" rx="10" fill="#f0e4cf"/>\n<text x="76" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a6a30">tap:</text>\n<text x="76" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a6a30">back</text>\n<text x="484" y="110" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a6a30">tap:</text>\n<text x="484" y="126" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a6a30">next</text>\n<text x="280" y="100" text-anchor="middle" font-family="Georgia" font-size="13" fill="#33291c">tap the middle</text>\n<text x="280" y="120" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">hide everything, just read</text>\n<path d="M200 200 q80 20 160 0" stroke="#c05b3c" stroke-width="2" fill="none" marker-end="url(#a7)"/>\n<text x="280" y="222" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#c05b3c">swipe: turn the chapter</text>\n<defs><marker id="a7" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#c05b3c"/></marker></defs>\n</svg>\n\nBut there is an order of precedence, and it is worth knowing because it prevents maddening bugs:\n\n- If you were **selecting text**, nothing else happens \u2014 a selection is sacred.\n- If you just **swiped** (moved more than 70 pixels sideways), the chapter turns and the tap that ends a swipe is suppressed for 80 milliseconds so it cannot ALSO count as a tap. This tiny suppression is the difference between an app that feels right and one that fights you.\n- If you tapped a **highlight** while holding the eraser, the highlight dies.\n- Only then do the tap zones apply: left 15%, right 15%, middle.\n\nThe chapter itself arrives through one line that deserves explanation: the Reader sets `innerHTML` of the page to the chapter\'s pre-rendered HTML, and then an effect immediately re-applies your saved highlights on top. Which brings us to the cleverest trick in the app.\n\n## Highlights that refuse to die\n\nHere is the problem nobody warns you about: a highlight is a `<span>` wrapped around text \u2014 but the chapter HTML is rebuilt from scratch every time you visit. Your span is bulldozed on every visit. The mockup\'s highlights died exactly this way when you switched books.\n\nThe fix: never store the span. Store *instructions for finding the text again*.\n\n<svg viewBox="0 0 560 200" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="200" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<text x="40" y="48" font-family="Georgia" font-size="13" fill="#33291c">\u2026the connection lives in </text>\n<text x="216" y="48" font-family="Georgia" font-size="13" fill="#33291c" style="font-style:italic">one file</text>\n<text x="272" y="48" font-family="Georgia" font-size="13" fill="#33291c">. Nothing else opens its own\u2026</text>\n<rect x="208" y="32" width="72" height="24" rx="4" fill="#ffe08a" opacity="0.55"/>\n<rect x="120" y="90" width="320" height="80" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="280" y="115" text-anchor="middle" font-family="monospace" font-size="11" fill="#33291c">exact: "one file"</text>\n<text x="280" y="136" text-anchor="middle" font-family="monospace" font-size="11" fill="#33291c">occ: 2 \xB7 chapter: 3</text>\n<text x="280" y="157" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">"the 2nd time \'one file\' appears in chapter 3"</text>\n<line x1="244" y1="58" x2="266" y2="84" stroke="#8a7f70" stroke-width="1.5" marker-end="url(#a8)"/>\n<defs><marker id="a8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nWhen you drag the highlighter, the app records three things: the **exact text** you selected, **which occurrence** of that text it was (maybe "one file" appears four times \u2014 yours was the second), and the **chapter**. That object goes to the store.\n\nEvery time the chapter renders, `highlights.js` replays the instructions: walk the chapter text, find the second "one file", wrap it in a fresh span. The span is disposable; the instructions are forever. Reload the app, change the theme, come back next week \u2014 the highlight re-materializes every time, because finding the second "one file" in chapter three always gives the same answer.\n\nThis is a pattern worth keeping in your pocket for every future project: **when the display is rebuilt regularly, store recipes, not results.**\n## The pen: strokes, undo, and the ignored palm\n\nThe note canvas looks like magic and is actually bookkeeping. Every gesture of the S Pen flows through one decision tree:\n\n<svg viewBox="0 0 560 250" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="250" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="200" y="24" width="160" height="42" rx="9" fill="#fff" stroke="#8a7f70" stroke-width="2"/>\n<text x="280" y="50" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">pointer touches canvas</text>\n<rect x="60" y="110" width="180" height="56" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="150" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">pointerType = "pen"</text>\n<text x="150" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">draw + record the stroke</text>\n<rect x="330" y="110" width="180" height="56" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="420" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">pointerType = "touch"</text>\n<text x="420" y="152" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">that is a palm \u2014 ignore it</text>\n<line x1="240" y1="66" x2="170" y2="104" stroke="#8a7f70" stroke-width="2" marker-end="url(#a9)"/>\n<line x1="320" y1="66" x2="400" y2="104" stroke="#8a7f70" stroke-width="2" marker-end="url(#a9)"/>\n<rect x="60" y="196" width="180" height="40" rx="9" fill="#fff" stroke="#8a7f70" stroke-dasharray="5 4"/>\n<text x="150" y="221" text-anchor="middle" font-family="monospace" font-size="10" fill="#33291c">{c, w, pts:[[x,y]\u2026]}</text>\n<line x1="150" y1="166" x2="150" y2="190" stroke="#c9bfa8" stroke-width="1.5"/>\n<defs><marker id="a9" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThe tablet already knows the difference between your pen tip and your hand \u2014 every pointer event is labeled. Palm rejection, which sounds like a research problem, is one `if` statement: touch on the canvas gets a polite little "palm ignored" toast and nothing else.\n\nThe real design decision is that dashed box: a stroke is **data**, not pixels. Color, width, and the list of points the pen passed through. The canvas pixels are just the current performance of that data \u2014 which buys us three features for free:\n\n- **Undo** is `strokes.pop()` then redraw the rest. No pixel surgery.\n- **Theme changes** re-resolve the ink color and redraw \u2014 your "auto" strokes follow the theme.\n- **ML Kit, later**, wants exactly this: point sequences are what handwriting recognition eats. We have been feeding the future this whole time.\n\nWhen you save, the honest-transcription box appears (you type what you wrote \u2014 the app does not pretend to read handwriting it cannot read yet), and the note keeps *both* the text and the strokes. The day the ML Kit plugin lands, old ink notes can be recognized retroactively. Nothing you write today is wasted.\n\n## Themes: the one-variable trick\n\nFour themes, six page styles, and yet almost no theme code exists. The entire system is CSS variables \u2014 one of those ideas that feels like cheating once you see it:\n\n<svg viewBox="0 0 560 220" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="220" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<circle cx="80" cy="60" r="20" fill="#1a1d21"/>\n<circle cx="80" cy="60" r="20" fill="none" stroke="#e0a458" stroke-width="3" stroke-dasharray="31 63"/>\n<text x="80" y="105" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a7f70">you pick "dark"</text>\n<rect x="190" y="30" width="180" height="90" rx="9" fill="#fff" stroke="#8a7f70"/>\n<text x="280" y="52" text-anchor="middle" font-family="monospace" font-size="10" fill="#33291c">--bg: #1a1d21</text>\n<text x="280" y="72" text-anchor="middle" font-family="monospace" font-size="10" fill="#33291c">--ink: #e8e6e1</text>\n<text x="280" y="92" text-anchor="middle" font-family="monospace" font-size="10" fill="#33291c">--accent: #e0a458</text>\n<text x="280" y="110" text-anchor="middle" font-family="monospace" font-size="10" fill="#8a7f70">\u202612 more</text>\n<line x1="105" y1="60" x2="183" y2="60" stroke="#8a7f70" stroke-width="2" marker-end="url(#aa)"/>\n<rect x="420" y="20" width="120" height="30" rx="7" fill="#fff" stroke="#c9bfa8"/>\n<text x="480" y="39" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#33291c">every button</text>\n<rect x="420" y="60" width="120" height="30" rx="7" fill="#fff" stroke="#c9bfa8"/>\n<text x="480" y="79" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#33291c">every card</text>\n<rect x="420" y="100" width="120" height="30" rx="7" fill="#fff" stroke="#c9bfa8"/>\n<text x="480" y="119" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#33291c">the candle flame</text>\n<line x1="370" y1="75" x2="413" y2="75" stroke="#8a7f70" stroke-width="2" marker-end="url(#aa)"/>\n<text x="280" y="165" text-anchor="middle" font-family="Georgia" font-size="12" fill="#33291c">nothing knows which theme is active \u2014</text>\n<text x="280" y="187" text-anchor="middle" font-family="Georgia" font-size="12" fill="#33291c">everything just wears var(--accent)</text>\n<defs><marker id="aa" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThe app root carries `data-theme="dark"`, and one CSS block defines fifteen variables for that value. Every component below simply wears `var(--accent)` or `var(--ink)` without knowing or caring what theme is active. Switching themes changes one attribute; the browser cascades the new values into thousands of places in a single frame.\n\nThe same trick powers three more systems, stacked like transparent sheets:\n\n- `data-page="scroll"` switches the page-style variables and wakes the matching scene.\n- `--pop-anim` is a variable holding an entire animation \u2014 pastel\'s says *bubble*, dark\'s says *fade* \u2014 so every popup in the app inherits its theme\'s personality from one line.\n- The per-page stains on the scroll are variables too: each chapter seeds `--st1` through `--st5` with positions computed from the chapter number, so chapter III always has *its* stains, and no two chapters share them.\n\nWhen you build your next project and reach for a color, remember: name the decision once, reference it everywhere. It is the same "one door" rule from your handbook, wearing CSS clothes.\n\n## The scenes: painting with gradients\n\nThe terrace behind your scroll contains no images. The sky, the town, the columns, the candle, the clouds \u2014 all of it is CSS gradients on empty divs, layered like a paper theatre:\n\n<svg viewBox="0 0 560 250" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="250" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<g transform="translate(30,20)">\n<rect x="0" y="0" width="200" height="44" rx="7" fill="#f0c88c" stroke="#d9cfba"/>\n<text x="220" y="28" font-family="sans-serif" font-size="10" fill="#8a7f70">1 \xB7 sky gradient + sun + drifting clouds</text>\n<rect x="14" y="38" width="200" height="44" rx="7" fill="#b0703a" stroke="#d9cfba"/>\n<text x="234" y="66" font-family="sans-serif" font-size="10" fill="#8a7f70">2 \xB7 town silhouette (one small SVG, repeated)</text>\n<rect x="28" y="76" width="200" height="44" rx="7" fill="#b89468" stroke="#d9cfba"/>\n<text x="248" y="104" font-family="sans-serif" font-size="10" fill="#8a7f70">3 \xB7 columns framing the view</text>\n<rect x="42" y="114" width="200" height="44" rx="7" fill="#6a4426" stroke="#d9cfba"/>\n<text x="262" y="142" font-family="sans-serif" font-size="10" fill="#8a7f70">4 \xB7 desk + easel + candle with light cone</text>\n<rect x="56" y="152" width="200" height="44" rx="7" fill="#e9d8ab" stroke="#c05b3c" stroke-width="2"/>\n<text x="276" y="180" font-family="sans-serif" font-size="10" fill="#c05b3c">5 \xB7 your stained scroll, leaning back 4\xB0</text>\n</g>\n</svg>\n\nLayer five leans back with a real 3D transform (`rotateX(4deg)` with perspective), which is why it feels *placed* rather than pasted. The clouds and birds are on 50-to-95-second animation loops \u2014 slow enough that you notice them the way you notice weather, not the way you notice a screensaver.\n\nTwo rules keep the scenes from becoming clutter, and they are enforced in CSS, not by discipline:\n\n- The scene layer has `pointer-events: none` \u2014 it physically cannot steal a tap from the book.\n- Ambience never enters the text column. Lamps, cats, and clouds live at the edges.\n\nTomorrow\'s art pass will replace some painted-by-gradient layers with painted-by-you-or-AI images, but the *architecture* stays: static beauty at the back, small CSS life on top, text untouchable in front.\n\n## Sound from thin air, and what the tablet adds\n\nThe ambient sound currently ships zero audio files. The birds are born in the moment: an oscillator starts at a random high frequency, slides down like a whistle, and a volume envelope shapes it into a chirp. Crickets are the same idea pulsed six times fast. The town murmur is random noise squeezed through a filter until only the muffled middle remains \u2014 the acoustic equivalent of hearing a market through a wall.\n\n<svg viewBox="0 0 560 180" width="100%" style="max-width:560px;display:block;margin:16px auto;">\n<rect x="0" y="0" width="560" height="180" rx="14" fill="#f6f1e4" stroke="#d9cfba"/>\n<rect x="30" y="60" width="130" height="50" rx="9" fill="#fff" stroke="#7d54ab" stroke-width="2"/>\n<text x="95" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">oscillator</text>\n<text x="95" y="99" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">a pure tone</text>\n<rect x="215" y="60" width="130" height="50" rx="9" fill="#fff" stroke="#c05b3c" stroke-width="2"/>\n<text x="280" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">gain envelope</text>\n<text x="280" y="99" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">shapes it into a chirp</text>\n<rect x="400" y="60" width="130" height="50" rx="9" fill="#fff" stroke="#3c6e71" stroke-width="2"/>\n<text x="465" y="82" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#33291c">speakers</text>\n<text x="465" y="99" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a7f70">tjilp tjilp</text>\n<line x1="160" y1="85" x2="208" y2="85" stroke="#8a7f70" stroke-width="2" marker-end="url(#ab)"/>\n<line x1="345" y1="85" x2="393" y2="85" stroke="#8a7f70" stroke-width="2" marker-end="url(#ab)"/>\n<path d="M40 40 q6 -14 12 0 q6 -14 12 0" stroke="#7d54ab" stroke-width="2" fill="none"/>\n<defs><marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 Z" fill="#8a7f70"/></marker></defs>\n</svg>\n\nThe app checks the clock: before 20:00 you get birds and murmur, after it, crickets. When the real recorded loops arrive (mono opus files, about forty kilobytes per ten-second loop \u2014 the budget math lives in `assets/sounds/README.md`), only `audio.js` changes. Everything else already speaks to it through two functions: start and stop. One door, again.\n\nAnd the tablet? Capacitor\'s bridge is what makes the suitcase more than a suitcase. The web side asks in JavaScript; native Android answers:\n\n- **Preferences** \u2014 already wired: your settings and notes go into real device storage.\n- **Text-to-speech** \u2014 the Listen screen, last on the build order, will ask the bridge to read chapters in a Dutch or English Google voice.\n- **ML Kit Digital Ink** \u2014 the handwriting engine, a small custom plugin, fed by the stroke data we are already collecting.\n- **Status bar** \u2014 one call hides Android\'s clock and buttons, so tap-to-fullscreen will mean *truly* full screen.\n\n## Where you are, and what you now know\n\nLook at what is actually running on your machine tonight: a themed, scened, pen-ready reading app with persistent notes, resurrecting highlights, seeded stains, a candle that burns down while you read, and a book inside it that explains itself. Built in one day, on top of things you already understood \u2014 one-door thinking from your handbook, forms-and-state instincts from Korva, and the patience to ask "why is it bland?" until it was not.\n\nThe concepts in your pocket now, each earned the honest way:\n\n- **Round trips vs local apps** \u2014 and when each is right.\n- **State \u2192 render \u2192 event** \u2014 the loop that is all of React.\n- **Stores before screens** \u2014 data first, display second, always.\n- **Recipes, not results** \u2014 the highlight trick, useful forever.\n- **Strokes as data** \u2014 drawings that undo, re-theme, and await recognition.\n- **Name it once** \u2014 CSS variables as the "one door" rule for design.\n\nTomorrow: ambience art, real crickets, and your tablet. The scroll is resting on its easel. So should you.\n\n\u25C6 \u25C6 \u25C6\n';

// reader-app/src/lib/books.js
function parseBook(reg) {
  if (reg.chapters && reg.chapters.length) return reg;
  const lines = (reg.source || "").split("\n");
  let title = reg.title;
  const chapters = [];
  let cur = null;
  for (const line of lines) {
    if (line.startsWith("# ") && !cur && !chapters.length) {
      title = line.slice(2).trim();
      continue;
    }
    if (line.startsWith("## ")) {
      if (cur) chapters.push(cur);
      cur = { title: line.slice(3).trim(), md: "" };
      continue;
    }
    if (cur) cur.md += line + "\n";
  }
  if (cur) chapters.push(cur);
  if (!chapters.length) chapters.push({ title, md: reg.source });
  return {
    ...reg,
    title,
    chapters: chapters.map((c) => ({ title: c.title, html: g.parse(c.md) }))
  };
}
var cache = null;
var imported = [];
function setImportedBooks(list) {
  imported = list || [];
  cache = null;
}
function getBooks() {
  if (!cache) cache = [...REGISTRY, ...imported].map(parseBook);
  return cache;
}
function getBook(id) {
  return getBooks().find((b2) => b2.id === id);
}
function guessShelf(source) {
  const codey = /```|npm |function |SELECT |<\?php|config|install/i.test(source);
  return codey ? { shelf: "handbooks", genre: "Handbooks" } : { shelf: "books", genre: "Books \xB7 Imported" };
}
function hueFor(title) {
  let h = 0;
  for (const ch of title) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
function coverStyle(book) {
  return { "--chue": book.hue };
}
function monogram(title) {
  return title.split(" ").filter((w2) => w2.length > 2).map((w2) => w2[0]).join("").slice(0, 2).toUpperCase();
}
function roman(n) {
  const map = [[1e3, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let s = "";
  for (const [v2, r] of map) {
    while (n >= v2) {
      s += r;
      n -= v2;
    }
  }
  return s;
}

// reader-app/src/lib/storage.js
var prefs = null;
var ready = (async () => {
  try {
    const m2 = await import("@capacitor/preferences");
    prefs = m2.Preferences;
  } catch (e) {
    prefs = null;
  }
})();
async function load(key, fallback) {
  await ready;
  try {
    if (prefs) {
      const { value } = await prefs.get({ key });
      return value ? JSON.parse(value) : fallback;
    }
    const v2 = localStorage.getItem(key);
    return v2 ? JSON.parse(v2) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function save(key, val) {
  await ready;
  const s = JSON.stringify(val);
  try {
    if (prefs) {
      await prefs.set({ key, value: s });
      return;
    }
    localStorage.setItem(key, s);
  } catch (e) {
  }
}

// reader-app/src/lib/idb.js
var DB = "inkling";
var STORE = "books";
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE)) {
        req.result.createObjectStore(STORE, { keyPath: "id" });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbAllBooks() {
  try {
    const db = await openDb();
    return await new Promise((resolve) => {
      const req = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch (e) {
    return [];
  }
}
async function idbPutBook(book) {
  try {
    const db = await openDb();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(book);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) {
    return false;
  }
}
async function idbDeleteBook(id) {
  try {
    const db = await openDb();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(id);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) {
    return false;
  }
}
